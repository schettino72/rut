<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Incremental Testing — Cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'JetBrains Mono', Consolas, monospace;
    background: #0d1117;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .container {
    background: #0d1117;
    padding: 24px;
    width: 320px;
    height: 240px;
  }

  svg {
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div class="container">
  <svg viewBox="0 0 272 192">
    <!-- Edges (drawn first, behind nodes) -->
    <!-- skip edges -->
    <line x1="60" y1="36" x2="28" y2="84" stroke="#1a1f26" stroke-width="2"/>
    <line x1="60" y1="36" x2="90" y2="84" stroke="#1a1f26" stroke-width="2"/>
    <!-- affected edges -->
    <line x1="160" y1="36" x2="90" y2="84" stroke="#2ea043" stroke-width="2" opacity="0.5"/>
    <line x1="160" y1="36" x2="160" y2="84" stroke="#2ea043" stroke-width="2" opacity="0.5"/>
    <line x1="240" y1="36" x2="220" y2="84" stroke="#1a1f26" stroke-width="2"/>
    <!-- skip edges bottom -->
    <line x1="28" y1="84" x2="28" y2="156" stroke="#1a1f26" stroke-width="2"/>
    <!-- affected edges bottom -->
    <line x1="90" y1="84" x2="90" y2="156" stroke="#2ea043" stroke-width="2" opacity="0.5"/>
    <line x1="160" y1="84" x2="160" y2="156" stroke="#2ea043" stroke-width="2" opacity="0.5"/>
    <line x1="160" y1="84" x2="220" y2="156" stroke="#2ea043" stroke-width="2" opacity="0.5"/>
    <!-- skip edges bottom -->
    <line x1="220" y1="84" x2="220" y2="156" stroke="#1a1f26" stroke-width="2"/>

    <!-- Top row: source modules -->
    <!-- skip node -->
    <rect x="44" y="22" width="32" height="28" rx="4" fill="#161b22" stroke="#1a1f26" stroke-width="1.5"/>
    <!-- changed node (the trigger) -->
    <rect x="144" y="22" width="32" height="28" rx="4" fill="#1a2e1a" stroke="#2ea043" stroke-width="1.5"/>
    <circle cx="160" cy="26" r="3" fill="#2ea043"/>
    <!-- skip node -->
    <rect x="224" y="22" width="32" height="28" rx="4" fill="#161b22" stroke="#1a1f26" stroke-width="1.5"/>

    <!-- Middle row: modules that import -->
    <!-- skip node -->
    <rect x="12" y="70" width="32" height="28" rx="4" fill="#161b22" stroke="#1a1f26" stroke-width="1.5"/>
    <!-- affected -->
    <rect x="74" y="70" width="32" height="28" rx="4" fill="#1a2e1a" stroke="#2ea043" stroke-width="1.5"/>
    <!-- affected -->
    <rect x="144" y="70" width="32" height="28" rx="4" fill="#1a2e1a" stroke="#2ea043" stroke-width="1.5"/>
    <!-- skip node -->
    <rect x="204" y="70" width="32" height="28" rx="4" fill="#161b22" stroke="#1a1f26" stroke-width="1.5"/>

    <!-- Bottom row: test modules -->
    <!-- skip test -->
    <rect x="12" y="142" width="32" height="28" rx="4" fill="#161b22" stroke="#1a1f26" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- affected test -->
    <rect x="74" y="142" width="32" height="28" rx="4" fill="#1a2e1a" stroke="#2ea043" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- affected test -->
    <rect x="144" y="142" width="32" height="28" rx="4" fill="#1a2e1a" stroke="#2ea043" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- affected test -->
    <rect x="204" y="142" width="32" height="28" rx="4" fill="#1a2e1a" stroke="#2ea043" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- skip test -->
    <rect x="244" y="142" width="24" height="28" rx="4" fill="#161b22" stroke="#1a1f26" stroke-width="1.5" stroke-dasharray="4 3"/>
  </svg>
</div>

</body>
</html>
